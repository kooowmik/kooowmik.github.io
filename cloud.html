<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://kit.fontawesome.com/c6b6ed360e.js" crossorigin="anonymous"></script>
    <script></script>
    <title>Cloud</title>
    <style>
        body {
            font-family: "Pretendard", sans-serif;
            margin: 0;
            width: 100vw;
            height: 100dvh;
            display: flex;
            background-color: rgb(250, 250, 253);
        }

        .loading {
            width: 100vw;
            height: 100dvh;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 998;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 1vw, 25px);
        }

        .app {
            padding: 7vw 10vw;
            width: 100%;
            height: calc(100dvh - 14vw);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            margin: 0;
            font-size: clamp(20px, 2vw, 30px);
            font-weight: 600;
        }

        .btnArea {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hideBtn {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .deleteBtn {
            color: rgb(251, 94, 94);
            cursor: pointer;
            padding: 5px 20px;
        }

        .selectAllBtn {
            display: flex;
            gap: 5px;
        }

        .editBtn {
            cursor: pointer;
            font-size: 13px;
            padding: 5px 20px;
            border-radius: 10px;
            background-color: rgb(253, 253, 253);
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }

        .title span {
            font-weight: 300;
        }

        .container {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 20px;
        }

        .area {
            flex: 1;
            background-color: white;
            border-radius: 20px;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }

        .area-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hrefArea {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: white;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            border-radius: 20px;
            gap: 20px;
        }

        .hrefArea a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: black;
        }

        .hrefArea p {
            margin: 0;
        }

        .hrefArea img {
            width: 20px;
            height: 20px;
        }

        .uploadArea {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        #fileInput {
            width: 300px;
            height: 60px;
        }

        #customBtn {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(16px, 1vw, 18px);
            border-radius: 10px;
            border: 1.5px dashed rgb(237, 237, 237);
            color: rgb(188, 188, 188);
        }

        .btn {
            width: 100%;
            height: 50px;
            min-height: 50px;
            border: none;
            background-color: rgb(255, 255, 255);
            color: black;
            border-radius: 10px;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            outline: none;
            font-size: 16px;
            font-weight: 500;
        }

        .btn:hover {
            background-color: black;
            color: white;
            transition-duration: 0.3s;
        }

        .textArea {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .textArea i {
            margin: 10px 5px 10px 0;
            align-self: end;
            color: rgb(169, 169, 169);
            font-size: 20px;
            cursor: pointer;
        }

        .code {
            flex: 1;
            outline: none;
            border: none;
            resize: none;
        }

        .loadArea {
            height: 100%;
            padding: 0 10px 0 30px; /* top은 loadArea_navigation의 height만큼 */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #lists {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 20px;
            overflow-y: auto;
        }

        #lists .listContainer:first-child {
            margin-top: 20px;
        }

        #lists .listContainer:last-child {
            margin-bottom: 20px;
        }

        .checkbox {
            display: none;
        }

        .listContainer {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .listContainer p {
            margin: 0;
            font-size: clamp(16px, 0.9vw, 18px);
            color: rgb(83, 83, 83);
        }

        .listContainer img {
            width: 5vh;
            height: 5vh;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgb(240, 240, 240);
        }

        .listContainer i {
            font-size: 2vh;
        }

        @media (max-width: 1100px) {
            .app {
                padding: 7vw 30px;
            }

            .listContainer img {
                width: 30px;
                height: 30px;
            }
        }

        @media (max-width: 900px) {
            body {
                height: auto;
            }

            .app {
                height: auto;
                padding: 7vw 15px;
            }

            .container {
                flex-direction: column-reverse;
            }

            .area {
                flex: none;
                padding: 15px;
                gap: 15px;
            }

            #lists .listContainer:first-child {
                margin-top: 15px;
            }

            #lists .listContainer:last-child {
                margin-bottom: 15px;
            }

            .textArea {
                height: 50vh;
            }

            .textArea i {
                margin: 0;
            }

            .uploadArea {
                height: 20vh;
            }

            .loadArea {
                height: 50vh;
                padding: 0 15px;
            }

            .btn {
                height: 45px;
                min-height: 45px;
                font-size: 14px;
            }

            .btnArea {
                display: none;
            }

            .hrefArea {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">업로드...</div>
    <div class="app">
        <header>
            <p class="title">imdongwook.<span>kim</span></p>

            <div class="btnArea">
                <div class="hideBtn">
                    <div class="selectAllBtn"><input type="checkbox" id="selectAllBtn">select all</div>
                    <div class="deleteBtn btnArea-btn" onclick="deleteFile()">delete</div>
                </div>
                <p class="editBtn" onclick="editMode()">edit</p>
            </div>
        </header>
        <div class="container">
            <div class="area-grid">
                <div class="hrefArea">
                    <a href="https://pt.daelim.ac.kr/ssoLogin.jsp">
                        <img src="daelim.png">
                        <p>대림대학교 학생포털</p>
                    </a>

                    <a href="https://chatgpt.com">
                        <img src="gpt.png">
                        <p>chat gpt</p>
                    </a>
                </div>
                <div class="uploadArea area">
                    <input type="file" id="fileInput" hidden>
                    <label for="fileInput" id="customBtn">클릭해서 파일 선택</label>
                    <button class="btn" onclick="upload()">업로드</button>
                </div>
            </div>

            <div class="textArea area">
                <textarea type="text" class="code" id="code"></textarea>
                <i class="fa-regular fa-clone" id="copyIcon" onclick="copy()"></i>
                <button class="btn" onclick="uploadCode()">변경</button>
            </div>

            <div class="loadArea area">
                <div id="lists"></div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = "https://jbcdnkvrzzeuvasmlrzg.supabase.co"
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpiY2Rua3ZyenpldXZhc21scnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MDYwNzEsImV4cCI6MjA5MTI4MjA3MX0.0DXxQ7h7ybqJlVS8fWvWAnZ5aAaI0D5OpzLQLCNuO7Q"

        const client = window.supabase.createClient(supabaseUrl, supabaseKey)

        const input = document.getElementById("fileInput")


        // 상태 감지
        input.addEventListener("change", () => {
            const file = input.files[0]

            if (file) {
                document.getElementById("customBtn").innerText = file.name
                document.getElementById("customBtn").style.color = "black"
            } else {
                document.getElementById("customBtn").innerText = "파일 선택"
                document.getElementById("customBtn").style.color = "rgb(188, 188, 188)"
            }
        })

        document.getElementById("selectAllBtn").addEventListener("change", (e) => {
            const checked = e.target.checked

            document.querySelectorAll(".checkbox").forEach(cb => {
                cb.checked = checked
            })
        })
        // 상태 감지

        function createUniqName(file) {
            const ext = file.name.split(".").pop()
            const uniq = crypto.randomUUID() + "." + ext
            console.log("uniq: " + uniq + "\nbase: " + file.name)
        }

        async function upload() {
            const file = document.getElementById("fileInput").files[0]
            if (!file) { return }

            showLoading()

            // const fileName = Date.now() + "_" + file.name


            const ext = file.name.split(".").pop()
            const uniq = crypto.randomUUID() + "." + ext

            const { error: uploadError } = await client.storage
                .from("files")
                .upload(`uploads/${uniq}`, file, {
                    upsert: false
                })

            if (uploadError) {
                console.log(uploadError)
                alert("failed")
                return
            }

            const { data, error } = await client
                .from("fileName")
                .insert([{
                    originName: file.name,
                    uniqName: uniq
                }])

            if (error) {
                console.error(error)
            }

            hideLoading()

            alert("업로드 성공")
            loadFiles()
        }

        function showLoading() {
            document.getElementById("loading").style.display = "flex"
        }

        function hideLoading() {
            document.getElementById("loading").style.display = "none"
        }

        async function loadFiles() {
            const { data, error } = await client.storage
                .from("files")
                .list("uploads")

                data.sort((a, b) => 
                    new Date(b.created_at) - new Date(a.created_at)
                )

            const lists = document.getElementById("lists")
            lists.innerHTML = ""

            for ( const file of data) {
                if (file.name === ".emptyFolderPlaceholder") continue

                const div = document.createElement("div")
                div.className = "listContainer"

                const span = document.createElement("span")
                span.className = "fileName"
                const { data: fileName, error } = await client
                    .from("fileName")
                    .select("*")
                    .eq("uniqName", file.name)
                    .maybeSingle()

                const temp = fileName?.originName || file.name
                span.innerText = (temp.length > 15) ? temp.slice(0, 15) + "..." : temp

                div.dataset.uniq = file.name

                if (error) {
                    console.error(error)
                }

                const input = document.createElement("input")
                input.type = "checkbox"
                input.className = "checkbox"

                div.appendChild(input)

                const ext = file.name.split('.').pop().toLowerCase()
                const isImage = ["png", "jpg", "jpeg", "gif", "webp"].includes(ext)

                const { data: urlData } = client.storage
                        .from("files")
                        .getPublicUrl(`uploads/${file.name}`, {
                            download: file.name
                        })

                if (isImage) {
                    const img = document.createElement("img")

                    img.src = urlData.publicUrl

                    div.appendChild(img)
                } else {
                    const img = document.createElement("i")
                    img.className = "fa-regular fa-file"
                    
                    div.appendChild(img)
                }

                span.onclick = async () => {
                    const { data, error } = await client.storage
                        .from("files")
                        .download(`uploads/${file.name}`)

                    if (error) {
                        console.error(error)
                        return
                    }

                    const url = URL.createObjectURL(data)

                    const a = document.createElement("a")
                    a.href = url
                    a.download = temp  // origin

                    document.body.appendChild(a)
                    a.click()
                    a.remove()

                    URL.revokeObjectURL(url)
                }
                
                div.appendChild(span)

                lists.appendChild(div)
            }
        }


        async function loadCode() {
            const { data, error } = await client
                .from("text")
                .select("content")
                .single();

            if (error) {
                console.error(error);
                return;
            }

            document.getElementById("copyIcon").className = "fa-regular fa-clone"
            document.getElementById("code").value = data.content || '';
        }

        async function uploadCode() {
            const text = document.getElementById("code").value

            const { data, error } = await client
                .from("text")
                .update({content: text})
                .eq('id', 1)

            if (error) {
                console.error(error)
            }

            alert("업데이트 완료")

            loadCode()
        }

        function copy() {
            const text = document.getElementById("code").value
            const icon = document.getElementById("copyIcon")

            navigator.clipboard.writeText(text)
                .then(() => icon.className = "fa-solid fa-check")
                .catch(err => console.error(err))
        }

        let isEditMode = false

        function editMode() {
            const editBtn = document.querySelector(".editBtn")
            if (!isEditMode) {
                const adm = prompt("code")
                if (adm != "0526") {
                    alert("권한 없음")
                    return
                }
                editBtn.style.backgroundColor = "black"
                editBtn.style.color = "white"
                editBtn.innerText = "done"
                document.querySelectorAll(".checkbox").forEach(element => {
                    element.style.display = "block"
                })
                document.querySelector(".hideBtn").style.display = "flex"
            } else {
                editBtn.style.backgroundColor = "rgb(253, 253, 253)"
                editBtn.style.color = "black"
                editBtn.innerText = "edit"
                document.querySelectorAll(".checkbox").forEach(element => {
                    element.style.display = "none"
                })
                document.querySelector(".hideBtn").style.display = "none"
            }
            isEditMode = !isEditMode
        }

        async function deleteFile() {
            for (const cb of document.querySelectorAll(".checkbox:checked")) {
                const uniqName = cb.parentElement.dataset.uniq

                const { error } = await client.storage
                    .from("files")
                    .remove([`uploads/${uniqName}`])

                const { error: dbError } = await client
                    .from("fileName")
                    .delete()
                    .eq("uniqName", uniqName)

                if (error || dbError) {
                    console.log("스토리지 에러: " + error + "\ndb 에러: " + dbError)
                    return
                }
            }

            loadFiles()
            editMode()
        }

        loadFiles()
        loadCode()
    </script>
</body>
</html>
